[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aynai"
version = "0.1.0"
description = "Intelligent Network Monitoring and Edge Anomaly Detection"
requires-python = ">=3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
test = [
    "pytest",
    "pandas",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["."]